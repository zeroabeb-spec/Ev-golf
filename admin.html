  get(key, fallback = null) {
    try { const v = localStorage.getItem(key); return v === null ? fallback : v; }
    catch (_) { return fallback; }
  },
  set(key, val) {
    try { localStorage.setItem(key, val); return true; }
    catch (_) { return false; }
  },
  remove(key) {
    try { localStorage.removeItem(key); return true; }
    catch (_) { return false; }
  }
};
const safeSession = {
  get(key, fallback = null) {

    try { sessionStorage.setItem(key, val); return true; }
    catch (_) { return false; }
  },
  remove(key) {
    try { sessionStorage.removeItem(key); return true; }
    catch (_) { return false; }
  }
};
</script>

function compressImage(file, maxDim = 900, quality = 0.75) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        try {
          const canvas = document.createElement('canvas');
          let w = img.width, h = img.height;
          if (w > h && w > maxDim) { h = h * maxDim / w; w = maxDim; }
          else if (h > maxDim) { w = w * maxDim / h; h = maxDim; }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        } catch (err) { reject(err); }
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function dataURLtoFile(dataUrl, filename) {
  if (!dataUrl || dataUrl.startsWith('http')) return null;
  try {
    const [meta, b64] = dataUrl.split(',');
    const mime = meta.match(/:(.*?);/)[1];
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new File([arr], filename, { type: mime });
  } catch (_) { return null; }
}

          battery: c.battery, batteryKwh: c.battery_kwh, motorPower: c.motor_power,
          range: c.range_km, charge: c.charge_time, speed: c.speed_max,
          dimensions: { length: c.dim_length, width: c.dim_width, height: c.dim_height },
          cargo: c.cargo, stock: c.stock, video: c.video_url, tag: c.tag,
          desc: c.description, photos: c.photos || [], accent: c.accent
        }));
      }
    } catch (err) { console.warn('Supabase cars failed:', err); }
  }
  try {
    const s = safeStorage.get('ev_cars_v8');
    if (!s) return JSON.parse(JSON.stringify(DEFAULT_CARS));

    return Array.isArray(parsed) && parsed.length ? parsed : JSON.parse(JSON.stringify(DEFAULT_CARS));
  } catch { return JSON.parse(JSON.stringify(DEFAULT_CARS)); }
}

async function saveCar(car) {
  if (CONFIG.supabase.enabled && supabase) {
    const row = {
      name: car.name, seats: car.seats, price: car.price,
      battery: car.battery, battery_kwh: car.batteryKwh, motor_power: car.motorPower,
      range_km: car.range, charge_time: car.charge, speed_max: car.speed,
      dim_length: car.dimensions?.length || 0, dim_width: car.dimensions?.width || 0, dim_height: car.dimensions?.height || 0,
      cargo: car.cargo, stock: car.stock, video_url: car.video, tag: car.tag,
      description: car.desc, photos: car.photos || [], accent: car.accent || '#10b981'
    };
    if (car.id) {
      const { error } = await supabase.from('cars').update(row).eq('id', car.id);
      if (error) throw error;
      return car.id;
    } else {
      const { data, error } = await supabase.from('cars').insert(row).select().single();
      if (error) throw error;
      return data.id;
    }
  }
  return car.id || (Math.max(0, ...carsData.map(c => c.id)) + 1);
}

async function uploadToStorage(dataUrlOrFile, folder) {
  if (CONFIG.supabase.enabled && supabase) {
    try {
      let file;
      if (typeof dataUrlOrFile === 'string' && dataUrlOrFile.startsWith('data:')) file = dataURLtoFile(dataUrlOrFile, `upload.jpg`);
      else if (dataUrlOrFile instanceof File) file = dataUrlOrFile;
      else return dataUrlOrFile;
      if (!file) return dataUrlOrFile;
      const ext = (file.name && file.name.split('.').pop()) || 'jpg';
      const filename = `${folder}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
      const { error } = await supabase.storage.from(CONFIG.supabase.storageBucket).upload(filename, file, { cacheControl: '3600', upsert: false });
      if (error) throw error;
      const { data: urlData } = supabase.storage.from(CONFIG.supabase.storageBucket).getPublicUrl(filename);
      return urlData.publicUrl;
    } catch (err) { console.warn('Storage upload failed:', err); return dataUrlOrFile; }
  }
  return dataUrlOrFile;
}

function showToast(message, type = 'success') {
  const container = document.getElementById('toastContainer');
  if (!container) { console.warn('Toast:', message); return; }
  const el = document.createElement('div');
  const isError = type === 'error';
  el.className = `pointer-events-auto flex w-full items-start gap-3 rounded-xl border-l-4 ${isError ? 'border-red-500' : 'border-emerald-500'} bg-slate-900 px-5 py-4 text-white shadow-2xl transition-all duration-300 opacity-0 translate-y-3`;
  el.innerHTML = `<i class="fa-solid ${isError ? 'fa-circle-exclamation text-red-400' : 'fa-circle-check text-emerald-400'} mt-0.5"></i><span class="text-sm font-medium leading-snug">${escapeHtml(message)}</span>`;
  container.appendChild(el);
  requestAnimationFrame(() => el.classList.remove('opacity-0', 'translate-y-3'));
  setTimeout(() => { el.classList.add('opacity-0', 'translate-y-3'); setTimeout(() => el.remove(), 320); }, 3500);
}

  if (!confirm('ማጥፋት ይፈልጋሉ?')) return;
  const order = orders.find(o => o.ref === ref);
  if (!order) return;
  try {

function renderCarFormPhotos() {
  const grid = document.getElementById('carPhotoGrid');
  const count = document.getElementById('photoCount');
  if (!grid) return;
  if (count) count.textContent = carFormPhotos.length;
  if (carFormPhotos.length === 0) {
    grid.innerHTML = '';
    grid.classList.add('hidden');
    return;
  }
  grid.classList.remove('hidden');
  grid.innerHTML = carFormPhotos.map((p, i) => `
    <div class="photo-tile">
      <img src="${p}" alt="photo ${i+1}">
      ${i === 0 ? '<span class="primary-badge">ዋና</span>' : ''}
      <button type="button" class="del-btn" data-remove-photo="${i}" aria-label="Remove">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
  `).join('');
  grid.querySelectorAll('[data-remove-photo]').forEach(b => {
    b.addEventListener('click', () => removeCarFormPhoto(Number(b.dataset.removePhoto)));
  });
}

function removeCarFormPhoto(i) {
  if (i < 0 || i >= carFormPhotos.length) return;
  carFormPhotos.splice(i, 1);
  renderCarFormPhotos();
  showToast('ፎቶ ተወግዷል', 'error');
}

function openCarForm(id) {
  const modal = document.getElementById('carFormModal');
  if (!modal) return;
  carFormPhotos = [];

  if (id) {
    const car = carsData.find(c => c.id === id);
    if (!car) return;
    document.getElementById('carFormTitle').textContent = 'Edit Car';
    document.getElementById('carFormId').value = car.id;
    document.getElementById('carFormName').value = car.name;
    document.getElementById('carFormSeats').value = car.seats;
    document.getElementById('carFormPrice').value = car.price;
    document.getElementById('carFormBattery').value = car.battery || '';
    document.getElementById('carFormBatteryKwh').value = car.batteryKwh || '';
    document.getElementById('carFormMotorPower').value = car.motorPower || '';
    document.getElementById('carFormRange').value = car.range || '';
    document.getElementById('carFormSpeed').value = car.speed || '';
    document.getElementById('carFormCharge').value = car.charge || '';
    document.getElementById('carFormLength').value = (car.dimensions && car.dimensions.length) || '';
    document.getElementById('carFormWidth').value = (car.dimensions && car.dimensions.width) || '';
    document.getElementById('carFormHeight').value = (car.dimensions && car.dimensions.height) || '';
    document.getElementById('carFormCargo').value = car.cargo || '';
    document.getElementById('carFormStock').value = car.stock || 'in_stock';
    document.getElementById('carFormVideo').value = car.video || '';
    document.getElementById('carFormTag').value = car.tag || '';
    document.getElementById('carFormDesc').value = car.desc || '';
    if (Array.isArray(car.photos) && car.photos.length) carFormPhotos = [...car.photos];
  } else {
    document.getElementById('carFormTitle').textContent = 'አዲስ መኪና';
    const f = document.getElementById('carForm'); if (f) f.reset();
    document.getElementById('carFormId').value = '';
  }

  const fileInput = document.getElementById('carPhotoFile'); if (fileInput) fileInput.value = '';
  const wrap = document.getElementById('carPhotoWrap'); if (wrap) wrap.classList.remove('has-file');
  renderCarFormPhotos();
  modal.classList.remove('hidden');
  modal.classList.add('flex');
}

function closeCarForm() {
  const modal = document.getElementById('carFormModal');
  if (modal) { modal.classList.add('hidden'); modal.classList.remove('flex'); }
  carFormPhotos = [];
}

document.getElementById('carPhotoFile')?.addEventListener('change', async (e) => {
  const files = Array.from(e.target.files || []);
  if (!files.length) return;
  let added = 0;
  for (const file of files) {
    if (!file.type.startsWith('image/')) continue;
    try {
      const compressed = await compressImage(file, 900, 0.75);
      const url = await uploadToStorage(compressed, 'cars');
      carFormPhotos.push(url);
      added++;
    } catch (err) { console.warn(err); }
  }
  if (added > 0) {
    document.getElementById('carPhotoWrap')?.classList.add('has-file');
    renderCarFormPhotos();
    showToast(`📸 ${added} ፎቶ ተጨምሯል`);
  } else {
    showToast('እባክዎ ምስል ብቻ ይጫኑ', 'error');
  }
  e.target.value = '';
});

document.getElementById('cloudinaryBtn')?.addEventListener('click', () => {
  if (!CONFIG.cloudinary.enabled || typeof cloudinary === 'undefined') {
    showToast('Cloudinary አልተዋቀረም', 'error');
    return;
  }
  if (!cloudinaryWidget) {
    try {
      cloudinaryWidget = cloudinary.createUploadWidget({
        cloudName: CONFIG.cloudinary.cloudName,
        uploadPreset: CONFIG.cloudinary.uploadPreset,
        folder: 'ev-golf/cars',
        sources: ['local', 'camera', 'url'],
        multiple: true,
        maxFiles: 10,
        clientAllowedFormats: ['jpg','jpeg','png','webp'],
        maxFileSize: 5000000,
        styles: { palette: {
          window: '#0f172a', windowBorder: '#10b981', tabIcon: '#10b981',
          textDark: '#f8fafc', textLight: '#94a3b8', link: '#34d399',
          action: '#059669', inProgress: '#34d399', complete: '#10b981', sourceBg: '#1e293b'
        }}
      }, (error, result) => {
        if (error) { console.error(error); return; }
        if (result.event === 'success') {
          carFormPhotos.push(result.info.secure_url);
          renderCarFormPhotos();
          showToast('☁️ ፎቶ ከCloudinary ተጨምሯል');
        }
      });
    } catch (err) { console.error(err); showToast('Cloudinary ስህተት', 'error'); return; }
  }
  cloudinaryWidget.open();
});

document.getElementById('carForm')?.addEventListener('submit', async (e) => {
  e.preventDefault();
  const id = document.getElementById('carFormId').value;
  const nameVal = document.getElementById('carFormName').value.trim();
  const seatsVal = parseInt(document.getElementById('carFormSeats').value) || 0;
  const priceVal = parseInt(document.getElementById('carFormPrice').value) || 0;

  if (!nameVal) { showToast('የመኪና ስም ያስፈልጋል', 'error'); return; }
  if (seatsVal < 1) { showToast('የመቀመጫ ብዛት ያስፈልጋል', 'error'); return; }
  if (priceVal < 0) { showToast('ዋጋ ያስፈልጋል', 'error'); return; }

  const data = {
    name: nameVal, seats: seatsVal, price: priceVal,
    battery: document.getElementById('carFormBattery').value.trim(),
    batteryKwh: parseFloat(document.getElementById('carFormBatteryKwh').value) || 0,
    motorPower: parseFloat(document.getElementById('carFormMotorPower').value) || 0,
    range: parseInt(document.getElementById('carFormRange').value) || 0,
    speed: parseInt(document.getElementById('carFormSpeed').value) || 0,
    charge: document.getElementById('carFormCharge').value.trim(),
    dimensions: {
      length: parseInt(document.getElementById('carFormLength').value) || 0,
      width: parseInt(document.getElementById('carFormWidth').value) || 0,
      height: parseInt(document.getElementById('carFormHeight').value) || 0
    },
    cargo: document.getElementById('carFormCargo').value.trim(),
    stock: document.getElementById('carFormStock').value,
    video: document.getElementById('carFormVideo').value.trim(),
    tag: document.getElementById('carFormTag').value.trim(),
    desc: document.getElementById('carFormDesc').value.trim(),
    photos: [...carFormPhotos]
  };

  try {
    if (id) {
      const car = carsData.find(c => c.id === Number(id));
      await saveCar({ ...data, id: Number(id), accent: car?.accent });
      if (car) Object.assign(car, data);
      saveCarsLocal();
    } else {
      const newId = await saveCar(data);
      const accents = ['#10b981','#0ea5e9','#f59e0b','#8b5cf6','#ef4444'];
      const newCar = { id: newId || (Math.max(0, ...carsData.map(c => c.id)) + 1), accent: accents[carsData.length % accents.length], ...data };
      carsData.push(newCar);
      saveCarsLocal();
    }
    renderAdminCars();
    closeCarForm();
    showToast('ተቀምጧል');
  } catch (err) {
    console.error(err);
    showToast('ማስቀመጥ አልተቻለም: ' + (err.message || ''), 'error');
  }
});

async function deleteCar(id) {
  if (!confirm('መኪናውን ማጥፋት ይፈልጋሉ?')) return;
  try {
    await deleteCarById(id);
    renderAdminCars();
    showToast('ተሰርዟል');
  } catch (err) { showToast('ስህተት', 'error'); }
}

      phoneVisible: document.getElementById('setPhoneVisible')?.checked || false,
      whatsapp: (document.getElementById('setWhatsapp')?.value || '').trim(),

      emailVisible: document.getElementById('setEmailVisible')?.checked || false,
      facebook: (document.getElementById('setFacebook')?.value || '').trim(),
      facebookVisible: document.getElementById('setFacebookVisible')?.checked || false,
      tiktok: (document.getElementById('setTiktok')?.value || '').trim(),
      tiktokVisible: document.getElementById('setTiktokVisible')?.checked || false
    },
    payment: {},
    order: {
      depositPercent: parseFloat(document.getElementById('setDeposit')?.value) || 10,
      vatRate: (parseFloat(document.getElementById('setVat')?.value) || 15) / 100
    }
  };
  ['telebirr','cbe','chapa','bankTransfer'].forEach(key => {
    const toggle = document.querySelector(`[data-pay="${key}"]`);
    const labelEl = document.querySelector(`[data-payfield="${key}-label"]`);
    const accEl = document.querySelector(`[data-payfield="${key}-account"]`);
    const nameEl = document.querySelector(`[data-payfield="${key}-name"]`);
    const bankEl = document.querySelector(`[data-payfield="${key}-bank"]`);
    newSettings.payment[key] = {
      enabled: toggle ? toggle.checked : false,
      label: labelEl ? labelEl.value.trim() : '',
      account: accEl ? accEl.value.trim() : '',
      name: nameEl ? nameEl.value.trim() : '',
      bank: bankEl ? bankEl.value.trim() : ''
    };
  });
  try {
    await saveSettingsDB(newSettings);
    settings = newSettings;
    showToast('ቅንብሮች ተቀምጠዋል');
  } catch (err) { showToast('ማስቀምጥ አልተቻለም', 'error'); }
}

async function resetSettings() {
  if (!confirm('ሁሉንም ቅንብሮች ወደ ነባሪ መመለስ ይፈልጋሉ?')) return;
  settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
  try { await saveSettingsDB(settings); } catch(_){}
  renderAdminSettings();
  showToast('ተመልሷል');
}

/* ===== STATS ===== */
function renderAdminStats() {
  const total = orders.length;
  const pending = orders.filter(o => o.status === 'pending').length;
  const delivered = orders.filter(o => o.status === 'delivered').length;
  const revenue = orders.filter(o => o.status !== 'cancelled').reduce((s,o) => s + (o.total||0), 0);
  const depositTotal = orders.filter(o => o.status !== 'cancelled').reduce((s,o) => s + (o.deposit||0), 0);
  const container = document.getElementById('adminStats');
  if (!container) return;
  container.innerHTML = `
    <div class="rounded-xl border border-slate-100 bg-white p-5 shadow-sm"><p class="text-xs font-bold uppercase tracking-wide text-slate-400">Total Orders</p><p class="mt-2 text-2xl font-black text-slate-900">${total}</p></div>
    <div class="rounded-xl border border-slate-100 bg-white p-5 shadow-sm"><p class="text-xs font-bold uppercase tracking-wide text-slate-400">Pending</p><p class="mt-2 text-2xl font-black text-amber-600">${pending}</p></div>
    <div class="rounded-xl border border-slate-100 bg-white p-5 shadow-sm"><p class="text-xs font-bold uppercase tracking-wide text-slate-400">Delivered</p><p class="mt-2 text-2xl font-black text-emerald-600">${delivered}</p></div>
    <div class="rounded-xl border border-slate-100 bg-white p-5 shadow-sm"><p class="text-xs font-bold uppercase tracking-wide text-slate-400">Total Revenue</p><p class="mt-2 text-xl font-black text-slate-900">${formatPrice(revenue)} <span class="text-xs font-bold text-slate-400">ETB</span></p><p class="mt-1 text-[10px] font-bold text-amber-600">Deposits: ${formatPrice(depositTotal)} ETB</p></div>
  `;
}

function exportOrders() {
  if (orders.length === 0) { showToast('ምንም orders የለም', 'error'); return; }
  const headers = ['Ref','Date','Car','Total','Deposit %','Deposit','Status','Name','Phone','Region','Zone','Woreda','City','Address','Note'];
  const rows = orders.map(o => [o.ref,o.ts,o.car,o.total,o.depositPct,o.deposit,o.status,o.name,o.phone,o.region,o.zone,o.woreda,o.city,o.address,o.note].map(v => `"${String(v ?? '').replace(/"/g,'""')}"`).join(','));
  const csv = [headers.join(','), ...rows].join('\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `ev-orders-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

/* ===== GLOBAL EXPOSURE ===== */
window.updateOrderStatus = updateOrderStatus;
window.deleteOrder = deleteOrder;
window.viewAdminImage = viewAdminImage;
window.openCarForm = openCarForm;
window.closeCarForm = closeCarForm;
window.deleteCar = deleteCar;
window.saveAdminSettings = saveAdminSettings;
window.resetSettings = resetSettings;
window.exportOrders = exportOrders;
window.logoutAdmin = logoutAdmin;

/* ===== KEYBOARD ===== */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    const cf = document.getElementById('carFormModal');
    if (cf && !cf.classList.contains('hidden')) closeCarForm();
  }
});

/* ===== BOOT ===== */
(async function boot() {
  if (safeSession.get('ev_admin') === '1') {
    showAdminDashboard();
  } else {
    showAdminGate();
  }
})();
</script>
