function cloudinaryOptimize(url,opts={}){
  if(!url||typeof url!=='string')return url;
  if(!url.includes('cloudinary.com')||!url.includes('/upload/'))return url;
  const{w=800,q='auto',f='auto',dpr='auto',crop='fill'}=opts;
  if(url.match(/\/upload\/[^/]*[a-z]_[^/]*\//))return url;
  const tr=[`w_${w}`,`q_${q}`,`f_${f}`,`dpr_${dpr}`,`c_${crop}`].join(',');
  return url.replace('/upload/',`/upload/${tr}/`);
}

function normalizePhotos(p){
  if(Array.isArray(p))return p.filter(x=>typeof x==='string'&&x.length>0);
  if(typeof p==='string'){
    const s=p.trim();
    if(!s||s==='null'||s==='undefined')return[];
    if(s.startsWith('[')){try{const a=JSON.parse(s);if(Array.isArray(a))return a.filter(x=>typeof x==='string'&&x.length>0)}catch(_){}}
    if(s.startsWith('{')&&s.endsWith('}'))return s.slice(1,-1).split(',').map(x=>x.trim().replace(/^"(.*)"$/,'$1')).filter(Boolean);
    if(/^(https?:|data:)/.test(s))return[s];
  }
  return[];
}

function trapFocus(container){
  const focusables=container.querySelectorAll('a[href], button:not([disabled]), textarea, input, select, [tabindex]:not([tabindex="-1"])');
  if(!focusables.length)return()=>{};
  const first=focusables[0],last=focusables[focusables.length-1];
  const handler=e=>{
    if(e.key!=='Tab')return;
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
  };
  container.addEventListener('keydown',handler);
  setTimeout(()=>{try{first.focus()}catch(_){}},60);
  return()=>container.removeEventListener('keydown',handler);
}
function compressImage(file,maxDim=1200,quality=0.82){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        try{
          const canvas=document.createElement('canvas');
          let w=img.width,h=img.height;
          if(w>h&&w>maxDim){h=h*maxDim/w;w=maxDim}
          else if(h>maxDim){w=w*maxDim/h;h=maxDim}
          canvas.width=w;canvas.height=h;
          canvas.getContext('2d').drawImage(img,0,0,w,h);
          resolve(canvas.toDataURL('image/jpeg',quality));
        }catch(err){reject(err)}
      };
      img.onerror=reject;
      img.src=e.target.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}
function dataURLtoFile(dataUrl,filename){
  if(!dataUrl||dataUrl.startsWith('http'))return null;
  try{
    const[meta,b64]=dataUrl.split(',');
    const mime=meta.match(/:(.*?);/)[1];
    const bin=atob(b64);
    const arr=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    return new File([arr],filename,{type:mime});
  }catch(_){return null}
}
async function uploadToCloudinary(fileOrDataUrl,folder='cars',onProgress=null){
  try{
    let file;
    if(fileOrDataUrl instanceof File)file=fileOrDataUrl;
    else if(typeof fileOrDataUrl==='string'&&fileOrDataUrl.startsWith('data:'))file=dataURLtoFile(fileOrDataUrl,'upload.jpg');
    else if(typeof fileOrDataUrl==='string'&&/^https?:/.test(fileOrDataUrl))return fileOrDataUrl;
    if(!file)throw new Error('Invalid file');
    const fd=new FormData();
    fd.append('file',file);
    fd.append('upload_preset',CONFIG.cloudinary.uploadPreset);
    fd.append('folder',`ev-golf/${folder}`);
    return await new Promise((resolve,reject)=>{
      const xhr=new XMLHttpRequest();
      xhr.open('POST',`https://api.cloudinary.com/v1_1/${CONFIG.cloudinary.cloudName}/image/upload`);
      xhr.upload.onprogress=e=>{if(e.lengthComputable&&onProgress)onProgress(Math.round(e.loaded/e.total*100))};
      xhr.onload=()=>{
        try{
          const json=JSON.parse(xhr.responseText);
          if(xhr.status>=200&&xhr.status<300&&json.secure_url){if(onProgress)onProgress(100);resolve(json.secure_url)}
          else reject(new Error(json.error?.message||'Upload failed'));
        }catch(err){reject(err)}
      };
      xhr.onerror=()=>reject(new Error('Network error'));
      xhr.send(fd);
    });
  }catch(err){console.error('❌ Cloudinary upload failed:',err);throw err}
}

async function saveCar(car){
  if(CONFIG.supabase.enabled&&supabase){
    const row={name:car.name,seats:car.seats,price:car.price,battery:car.battery,battery_kwh:car.batteryKwh,motor_power:car.motorPower,range_km:car.range,charge_time:car.charge,speed_max:car.speed,dim_length:car.dimensions?.length||0,dim_width:car.dimensions?.width||0,dim_height:car.dimensions?.height||0,cargo:car.cargo,stock:car.stock,video_url:car.video,tag:car.tag,target:car.target||'',description:car.desc,photos:normalizePhotos(car.photos),accent:car.accent||'#10b981'};
    const size=JSON.stringify(row).length;
    if(size>950000)throw new Error(`ፎቶዎቹ በጣም ብዙ ናቸው (${(size/1024).toFixed(0)} KB)።`);
    if(car.id){
      const{error}=await supabase.from('cars').update(row).eq('id',car.id);
      if(error)throw error;
      return car.id;
    }else{
      const{data,error}=await supabase.from('cars').insert(row).select().single();
      if(error)throw error;
      return data.id;
    }
  }
  return car.id||(Math.max(0,...carsData.map(c=>c.id))+1);
}

function showToast(message,type='success'){
  const container=document.getElementById('toastContainer');
  if(!container){console.warn('Toast:',message);return}
  const el=document.createElement('div');
  const isError=type==='error';
  el.className=`pointer-events-auto flex w-full items-start gap-3 rounded-xl border-l-4 ${isError?'border-red-500':'border-emerald-500'} bg-slate-900 px-5 py-4 text-white shadow-2xl transition-all duration-300 opacity-0 translate-y-3`;
  el.innerHTML=`<i class="fa-solid ${isError?'fa-circle-exclamation text-red-400':'fa-circle-check text-emerald-400'} mt-0.5"></i><span class="text-sm font-medium leading-snug">${escapeHtml(message)}</span>`;
  container.appendChild(el);
  requestAnimationFrame(()=>el.classList.remove('opacity-0','translate-y-3'));
  setTimeout(()=>{el.classList.add('opacity-0','translate-y-3');setTimeout(()=>el.remove(),320)},3500);
}

function getFilteredOrders(){
  const filter=document.getElementById('orderStatusFilter')?.value||'all';
  const q=(document.getElementById('orderSearch')?.value||'').toLowerCase();
  return orders.filter(o=>{
    const mS=filter==='all'||o.status===filter;
    const mQ=!q||(o.name||'').toLowerCase().includes(q)||(o.phone||'').includes(q)||(o.ref||'').toLowerCase().includes(q);
    return mS&&mQ;
  });
}

function goOrderPage(p){

}
function updateBulkBar(){
  const bar=document.getElementById('orderBulkBar');

  if(bulkSelected.size>0){bar.classList.remove('hidden');bar.classList.add('flex');if(cnt)cnt.textContent=bulkSelected.size}

}
function clearBulkSelection(){bulkSelected.clear();renderAdminOrders()}
async function applyBulkStatus(){
  const status=document.getElementById('bulkStatus')?.value;
  if(!status||!bulkSelected.size){showToast('Status ይምረጡ','error');return}
  if(!confirm(`${bulkSelected.size} orders ወደ "${status}" ይቀየሩ?`))return;
  try{
    for(const ref of bulkSelected){
      const order=orders.find(o=>o.ref===ref);
      if(order&&order.id)await updateOrderStatusDB(order.id,status);
      if(order)order.status=status;
    }
    safeStorage.set('ev_orders_v8',JSON.stringify(orders));
    bulkSelected.clear();
    renderAdminOrders();
    renderAdminGreeting();
    renderAdminStats();
    showToast('✅ Status ተቀይሯል');
  }catch(err){showToast('ስህተት','error')}
}

function renderCarFormPhotos(){

    activeSortable=new Sortable(grid,{

      onEnd:evt=>{

async function handleCarPhotoFiles(files){
  if(!files.length)return;
  const wrap=document.getElementById('carPhotoWrap');
  wrap?.classList.add('has-file');
  const grid=document.getElementById('carPhotoGrid');
  let added=0,failed=0;
  for(const file of files){
    if(!file.type.startsWith('image/')){failed++;continue}
    if(file.size>10*1024*1024){failed++;continue}
    const tile=document.createElement('div');
    tile.className='photo-tile';
    tile.innerHTML=`<div class="upload-progress"><div class="bar"><div style="width:0%"></div></div><div class="pct">0%</div></div>`;
    grid.classList.remove('hidden');
    grid.appendChild(tile);
    try{
      const compressed=await compressImage(file,1200,0.82);
      const url=await uploadToCloudinary(compressed,'cars',(pct)=>{
        const bar=tile.querySelector('.bar > div');
        const pctEl=tile.querySelector('.pct');
        if(bar)bar.style.width=pct+'%';
        if(pctEl)pctEl.textContent=pct+'%';
      });
      carFormPhotos.push(url);
      added++;
      tile.remove();
      renderCarFormPhotos();
    }catch(err){console.warn('Upload failed:',err);failed++;tile.remove()}
  }
  renderCarFormPhotos();
  if(added>0)showToast(`✅ ${added} ፎቶ ተጭኗል${failed?` (${failed} አልተሳካም)`:''}`);
  else showToast('❌ ፎቶ መጫን አልተቻለም','error');
}
document.getElementById('carPhotoFile')?.addEventListener('change',async e=>{
  const files=Array.from(e.target.files||[]);
  await handleCarPhotoFiles(files);
  e.target.value='';
});
const photoWrapEl=document.getElementById('carPhotoWrap');
if(photoWrapEl){
  ['dragenter','dragover'].forEach(ev=>photoWrapEl.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();photoWrapEl.classList.add('has-file')}));
  ['dragleave','drop'].forEach(ev=>photoWrapEl.addEventListener(ev,e=>{
    e.preventDefault();e.stopPropagation();
    if(ev==='dragleave'&&photoWrapEl.contains(e.relatedTarget))return;
    if(!carFormPhotos.length)photoWrapEl.classList.remove('has-file');
  }));
  photoWrapEl.addEventListener('drop',async e=>{
    const files=Array.from(e.dataTransfer?.files||[]).filter(f=>f.type.startsWith('image/'));
    if(!files.length)return;
    await handleCarPhotoFiles(files);
  });
}

function openTeamForm(id){
  const modal=document.getElementById('teamFormModal');
  if(!modal)return;
  teamFormPhoto=null;
  const team=(settings.team&&Array.isArray(settings.team))?settings.team:[];
  if(id){
    const m=team.find(x=>x.id===id);
    if(!m)return;
    document.getElementById('teamFormTitle').textContent='Edit Team Member';
    document.getElementById('teamFormId').value=m.id;
    document.getElementById('teamFormName').value=m.name||'';
    document.getElementById('teamFormRole').value=m.role||'';
    document.getElementById('teamFormBio').value=m.bio||'';
    document.getElementById('teamFormLinkedin').value=m.linkedin||'';
    document.getElementById('teamFormWhatsapp').value=m.whatsapp||'';
    document.getElementById('teamFormEmail').value=m.email||'';
    document.getElementById('teamFormPhone').value=m.phone||'';
    document.getElementById('teamFormPhotoUrl').value=(m.photo&&m.photo.startsWith('http'))?m.photo:'';

function closeTeamForm(){

function updateTeamPhotoPreview(){
  const wrap=document.getElementById('teamPhotoPreviewWrap');
  const img=document.getElementById('teamPhotoPreviewImg');
  const uploadLabel=document.getElementById('teamPhotoWrap');
  const uploadText=document.getElementById('teamPhotoText');
  if(teamFormPhoto){
    if(img)img.src=teamFormPhoto;
    if(wrap)wrap.classList.remove('hidden');
    if(uploadText)uploadText.style.display='none';
    if(uploadLabel)uploadLabel.classList.add('has-file');
  }else{
    if(wrap)wrap.classList.add('hidden');

document.getElementById('teamPhotoFile')?.addEventListener('change',async e=>{
  const file=e.target.files&&e.target.files[0];
  if(!file)return;
  if(!file.type.startsWith('image/')){showToast('እባክዎ ምስል ብቻ ይጫኑ','error');return}
  if(file.size>5*1024*1024){showToast('እባክዎ ከ 5MB በታች ምስል ይጫኑ','error');return}
  try{
    showToast('⏳ ፎቶ በመጫን ላይ...');
    const compressed=await compressImage(file,600,0.82);
    const url=await uploadToCloudinary(compressed,'team');
    teamFormPhoto=url;
    updateTeamPhotoPreview();
    showToast('✅ ፎቶ ተጭኗል');
  }catch(err){
    console.error(err);
    showToast('ፎቶ መጫን አልተቻለም','error');
  }
});
document.getElementById('teamFormPhotoUrl')?.addEventListener('input',e=>{

});
document.getElementById('teamForm')?.addEventListener('submit',async e=>{
  e.preventDefault();
  const id=document.getElementById('teamFormId').value;
  const name=document.getElementById('teamFormName').value.trim();
  const role=document.getElementById('teamFormRole').value.trim();
  const bio=document.getElementById('teamFormBio').value.trim();
  const linkedin=document.getElementById('teamFormLinkedin').value.trim();
  const whatsapp=document.getElementById('teamFormWhatsapp').value.trim();
  const email=document.getElementById('teamFormEmail').value.trim();
  const phone=document.getElementById('teamFormPhone').value.trim();
  const colorInput=document.querySelector('input[name="teamColor"]:checked');
  const color=colorInput?colorInput.value:'emerald';
  if(!name){showToast('ስም ያስፈልጋል','error');return}
  if(!role){showToast('ሚና ያስፈልጋል','error');return}
  const submitBtn=document.getElementById('teamFormSubmit');
  const orig=submitBtn?.innerHTML;
  if(submitBtn){submitBtn.disabled=true;submitBtn.innerHTML='<i class="fa-solid fa-spinner fa-spin mr-2"></i>በማስቀመጥ ላይ...'}
  try{
    if(!settings.team)settings.team=[];
    if(id){
      const idx=settings.team.findIndex(x=>x.id===Number(id));
      if(idx>=0){
        settings.team[idx]={...settings.team[idx],name,role,bio,linkedin,whatsapp,email,phone,color,photo:teamFormPhoto||settings.team[idx].photo};
      }
    }else{
      const newId=Math.max(0,...settings.team.map(x=>x.id||0))+1;
      settings.team.push({id:newId,name,role,bio,linkedin,whatsapp,email,phone,color,photo:teamFormPhoto});
    }
    await saveSettingsDB(settings);
    renderAdminTeam();
    closeTeamForm();
    showToast('✅ ተቀምጧል');
  }catch(err){
    console.error(err);
    showToast('ማስቀመጥ አልተቻለም','error');
  }finally{
    if(submitBtn){submitBtn.disabled=false;submitBtn.innerHTML=orig||'አስቀምጥ'}
  }
});

function renderCharts(){
  if(typeof Chart==='undefined')return;
  const days=[],totals=[];
  for(let i=6;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);d.setHours(0,0,0,0);
    const next=new Date(d);next.setDate(next.getDate()+1);
    const sum=orders.filter(o=>{const t=new Date(o.ts);return t>=d&&t<next&&o.status!=='cancelled'}).reduce((s,o)=>s+(o.total||0),0);
    days.push(d.toLocaleDateString('en',{weekday:'short'}));
    totals.push(sum);
  }
  if(statsChart1)statsChart1.destroy();
  const c1=document.getElementById('statsChart1');
  if(c1)statsChart1=new Chart(c1,{type:'bar',data:{labels:days,datasets:[{label:'ETB',data:totals,backgroundColor:'#10b981',borderRadius:6}]},options:{plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>(v/1000).toFixed(0)+'k'}}}}});
  const statuses=['pending','confirmed','delivered','cancelled'];
  const colors=['#f59e0b','#3b82f6','#10b981','#ef4444'];
  const counts=statuses.map(s=>orders.filter(o=>o.status===s).length);
  if(statsChart2)statsChart2.destroy();
  const c2=document.getElementById('statsChart2');
  if(c2)statsChart2=new Chart(c2,{type:'doughnut',data:{labels:statuses.map(s=>s.toUpperCase()),datasets:[{data:counts,backgroundColor:colors,borderWidth:0}]},options:{plugins:{legend:{position:'bottom'}}}});
}
function exportOrders(){
  if(!orders.length){showToast('ምንም orders የለም','error');return}
  const headers=['Ref','Date','Car','Total','Deposit %','Deposit','Status','Name','Phone','Region','Zone','Woreda','City','Address','Note'];
  const rows=orders.map(o=>[o.ref,o.ts,o.car,o.total,o.depositPct,o.deposit,o.status,o.name,o.phone,o.region,o.zone,o.woreda,o.city,o.address,o.note].map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(','));
  const csv=[headers.join(','),...rows].join('\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`ev-orders-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

window.saveAdminSettings=saveAdminSettings;
window.resetSettings=resetSettings;
window.exportOrders=exportOrders;
window.logoutAdmin=logoutAdmin;
window.toggleDarkMode=toggleDarkMode;
window.openOrderModal=openOrderModal;
window.closeOrderModal=closeOrderModal;
window.printInvoice=printInvoice;
window.printBulkInvoices=printBulkInvoices;
window.goOrderPage=goOrderPage;
window.applyBulkStatus=applyBulkStatus;
window.clearBulkSelection=clearBulkSelection;
window.openTeamForm=openTeamForm;
window.closeTeamForm=closeTeamForm;
window.deleteTeamMember=deleteTeamMember;
window.removeTeamPhoto=removeTeamPhoto;
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    const cf=document.getElementById('carFormModal');
    const od=document.getElementById('orderDetailOverlay');
    const tf=document.getElementById('teamFormModal');
    if(tf&&!tf.classList.contains('hidden'))closeTeamForm();
    else if(cf&&!cf.classList.contains('hidden'))closeCarForm();
    else if(od)closeOrderModal();
  }
});
(async function boot(){
  applyDarkMode();
  $$('.order-view-btn').forEach(x=>x.classList.toggle('active',x.dataset.view===ordersViewMode));
  $$('.car-view-btn').forEach(x=>x.classList.toggle('active',x.dataset.view===carsViewMode));
  if(checkAdminSession())showAdminDashboard();
  else showAdminGate();
})();
</script>
</body>
